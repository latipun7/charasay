# yaml-language-server: $schema=https://www.schemastore.org/prek.json

default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer

  # ── TOML ────────────────────────────────────────────────────────────
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.2.4
    hooks:
      - id: tombi-format
        files: \.toml$

  # ── Rust ────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        language: system
        entry: rustfmt
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        types: [rust]
        pass_filenames: false

  # ── Prettier ────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier
        args: [--write, --ignore-unknown]
        language: node
        types: [text]
        additional_dependencies:
          - prettier@3.9.5

  # ── Markdown ────────────────────────────────────────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
